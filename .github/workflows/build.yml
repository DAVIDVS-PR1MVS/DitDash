name: Criar executáveis do DitPlex

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyInstaller e compilar
        run: |
          python -m pip install --upgrade pip pyinstaller
          python Scripts/build.py --name DitPlex --clean

      - name: Padronizar nome do executável
        shell: bash
        run: |
          TAG_CLEAN="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_CLEAN" ] || [ "$TAG_CLEAN" = "$GITHUB_REF_NAME" ]; then
            TAG_CLEAN="1.0.3"
          fi
          mv "dist/DitPlex.exe" "dist/DitPlex-${TAG_CLEAN}-x64.exe"

      - name: Publicar executável do Windows na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/DitPlex-*-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-packages:
    name: Build Pacotes Linux (.rpm, .deb, .pkg.tar.zst)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyInstaller e compilar binário
        run: |
          python -m pip install --upgrade pip pyinstaller
          python Scripts/build.py --name DitPlex --clean

      - name: Instalar ferramentas de empacotamento (FPM e Pacman)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm bsdtar zstd
          sudo gem install --no-document fpm

      - name: Gerar Pacotes Linux (.rpm, .deb, .pkg.tar.zst)
        run: |
          TAG_CLEAN="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_CLEAN" ] || [ "$TAG_CLEAN" = "$GITHUB_REF_NAME" ]; then
            TAG_CLEAN="1.0.3"
          fi

          if [[ "$TAG_CLEAN" == *"-"* ]]; then
            VERSION="${TAG_CLEAN%%-*}"
            ITERATION="${TAG_CLEAN#*-}"
          else
            VERSION="$TAG_CLEAN"
            ITERATION="1"
          fi

          # 1. Empacotar RPM (Fedora, RHEL, openSUSE)
          fpm -s dir -t rpm \
            -n DitPlex \
            -v "$VERSION" \
            --iteration "$ITERATION" \
            --architecture x86_64 \
            --description "Utilitário DitPlex" \
            dist/DitPlex=/usr/bin/DitPlex \
            assets/logo.png=/usr/share/icons/hicolor/256x256/apps/ditplex.png \
            ditplex.desktop=/usr/share/applications/ditplex.desktop

          # 2. Empacotar DEB (Debian, Ubuntu, Mint)
          fpm -s dir -t deb \
            -n DitPlex \
            -v "$VERSION" \
            --iteration "$ITERATION" \
            --architecture amd64 \
            --description "Utilitário DitPlex" \
            dist/DitPlex=/usr/bin/DitPlex \
            assets/logo.png=/usr/share/icons/hicolor/256x256/apps/ditplex.png \
            ditplex.desktop=/usr/share/applications/ditplex.desktop

          # 3. Empacotar Pacman (Arch Linux, Manjaro)
          fpm -s dir -t pacman \
            -n DitPlex \
            -v "$VERSION" \
            --iteration "$ITERATION" \
            --architecture x86_64 \
            --description "Utilitário DitPlex" \
            dist/DitPlex=/usr/bin/DitPlex \
            assets/logo.png=/usr/share/icons/hicolor/256x256/apps/ditplex.png \
            ditplex.desktop=/usr/share/applications/ditplex.desktop

      - name: Publicar Pacotes Linux na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            DitPlex-*.x86_64.rpm
            DitPlex-*.amd64.deb
            DitPlex-*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-flatpak:
    name: Build Flatpak (.flatpak)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar binário Linux
        run: |
          python -m pip install --upgrade pip pyinstaller
          python Scripts/build.py --name DitPlex --clean

      - name: Instalar Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Adicionar repositório Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Construir Pacote Flatpak Bundle
        run: |
          TAG_CLEAN="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_CLEAN" ] || [ "$TAG_CLEAN" = "$GITHUB_REF_NAME" ]; then
            TAG_CLEAN="1.0.3"
          fi

          flatpak-builder --repo=repo --force-clean build-dir org.ditplex.DitPlex.yml
          flatpak build-bundle repo "DitPlex-${TAG_CLEAN}.flatpak" org.ditplex.DitPlex

      - name: Publicar Flatpak na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: DitPlex-*.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}