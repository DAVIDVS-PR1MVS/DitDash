name: Criar executáveis do DitPlex

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyInstaller e compilar
        run: |
          python -m pip install --upgrade pip pyinstaller
          python Scripts/build.py --name DitPlex --clean

      - name: Renomear executável
        run: |
          move dist\DitPlex.exe dist\DitPlex-Windows-x64.exe

      - name: Publicar executável do Windows na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/DitPlex-Windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-rpm:
    name: Build Linux (.rpm Fedora)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyInstaller e compilar binário
        run: |
          python -m pip install --upgrade pip pyinstaller
          python Scripts/build.py --name DitPlex --clean

      - name: Instalar ferramentas para geração de pacote RPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Empacotar em formato .rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.2"
          fi

          fpm -s dir -t rpm \
            -n DitPlex \
            -v "$VERSION" \
            --architecture x86_64 \
            --description "Utilitário DitPlex" \
            dist/DitPlex=/usr/bin/DitPlex \
            assets/logo.png=/usr/share/icons/hicolor/256x256/apps/ditplex.png \
            ditplex.desktop=/usr/share/applications/ditplex.desktop

      - name: Publicar pacote RPM na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: DitPlex-*.x86_64.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}